<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FerriScribe · Settings proposal (synthetic)</title><style>
:root{--bg:#fff;--nav:#f8f9fa;--input:#fff;--ink:#212529;--secondary:#495057;--border:#dee2e6;--active:#e7ecfd;--accent:#3b5bdb;--warn:#842029}[data-theme=dark]{--bg:#1a1b1e;--nav:#25262b;--input:#25262b;--ink:#c1c2c5;--secondary:#a5a7ab;--border:#373a40;--active:#1e2a5e;--accent:#91a7ff;--warn:#ff9e9e}*{box-sizing:border-box}body{margin:0;background:var(--nav);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}.lab{padding:12px 24px;display:flex;align-items:center;gap:16px;font-size:12px;color:var(--secondary)}button,select,input,textarea{font:inherit;color:inherit}button,select,input[type=number]{min-height:44px;border:1px solid var(--border);border-radius:4px;background:var(--input);padding:8px 12px}button{cursor:pointer}button:hover{background:var(--active)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}.window{margin:0 auto 24px;width:calc(100% - 48px);max-width:1120px;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}.title{padding:16px 24px;border-bottom:1px solid var(--border);font-size:17px;font-weight:600}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);height:720px;max-height:calc(100vh - 145px)}nav{padding:16px 12px;background:var(--nav);border-right:1px solid var(--border);overflow:auto}nav h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--secondary);margin:16px 12px 6px}nav h2:first-child{margin-top:0}nav a{display:flex;align-items:center;min-height:44px;padding:8px 12px;color:var(--secondary);text-decoration:none;border-radius:4px;line-height:1.3}nav a[aria-current=page]{background:var(--active);color:var(--accent);font-weight:600}nav a:hover{background:var(--active)}main{padding:28px 32px;overflow:auto;min-width:0}h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}p{margin:0;color:var(--secondary)}.intro{margin-bottom:28px}.group{margin-bottom:28px}.group h2{font-size:14px;margin:0;padding:0 0 10px;border-bottom:1px solid var(--border)}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,230px);align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--border)}.row label{font-weight:500}.row p{font-size:12px;margin-top:3px;max-width:42ch}.row>select,.row>input[type=number]{width:100%}.row>input[type=checkbox]{justify-self:end;margin:12px}.row .choice{display:flex;gap:8px}.choice select{width:100%;min-width:0}details{border-top:1px solid var(--border);padding:4px 0;margin-top:16px}summary{padding:12px 0;cursor:pointer;min-height:48px;font-weight:600}summary span{font-size:12px;font-weight:400;color:var(--secondary);margin-left:12px}.details-content{padding:0 0 16px}.status{display:flex;gap:8px;align-items:center;color:var(--secondary);font-size:12px;margin:12px 0}.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.toolbar{display:flex;gap:16px;align-items:center;margin:20px 0 12px}.toolbar select{flex:1;min-width:0}.source{font-size:12px;margin:8px 0 12px}.editor{display:block;width:100%;min-height:260px;resize:vertical;border:1px solid var(--border);border-radius:4px;padding:16px;background:var(--input);line-height:1.7;font-family:ui-monospace,monospace;font-size:13px}.footer{display:flex;align-items:center;gap:12px;margin-top:12px}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.footer span{font-size:12px;color:var(--secondary);margin-right:auto}.notice{padding:10px 12px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;margin:12px 0}.hidden{display:none}@media(max-width:750px){.window{width:calc(100% - 16px)}.lab{padding:8px}.layout{grid-template-columns:170px minmax(0,1fr)}nav{padding:12px 6px}main{padding:20px}.row{grid-template-columns:1fr;gap:8px}.row>input[type=checkbox]{justify-self:start}.toolbar{align-items:stretch;flex-direction:column}summary span{display:block;margin-left:18px}}@media(max-width:480px){.layout{display:flex;flex-direction:column;max-height:none;height:auto}nav{max-height:210px;border-right:0;border-bottom:1px solid var(--border)}main{overflow:visible}.lab{flex-wrap:wrap}.footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div class="lab"><strong>Design proposal · synthetic values · not the running app</strong><button id="theme">Switch theme</button></div><div class="window"><header class="title">Settings</header><div class="layout"><nav aria-label="Settings"><h2>Everyday</h2><a href="#general" data-page="general">General</a><a href="#audio">Recording &amp; Transcription</a><a href="#models" data-page="models">AI Models</a><h2>Clinical content</h2><a href="#prompts" data-page="prompts">Prompts &amp; Specialties</a><a href="#vocabulary">Vocabulary &amp; Templates</a><a href="#letters">Letter Audiences</a><h2>System</h2><a href="#storage">Storage &amp; Backup</a><a href="#sharing">Sharing</a><a href="#advanced">Advanced</a><a href="#about">About &amp; Updates</a></nav><main id="content"></main></div></div><template id="general"><h1>General</h1><p class="intro">Make FerriScribe comfortable to work in.</p><section class="group"><h2>Appearance</h2><div class="row"><label for="appearance">Theme</label><select id="appearance"><option>Light</option><option>Dark</option></select></div></section><section class="group"><h2>Saving</h2><div class="row"><div><label for="autosave">Autosave</label><p>Automatically save your work.</p></div><input id="autosave" type="checkbox" checked></div><div class="row"><div><label for="interval">Save interval</label><p>Seconds between saves · 10–600</p></div><input id="interval" type="number" value="30" min="10" max="600"></div></section><section class="group"><h2>Notifications</h2><div class="row"><div><label for="sound">Sound when a SOAP note is ready</label><p>A short completion chime, played locally.</p></div><input id="sound" type="checkbox" checked></div></section><p class="source">Prototype controls do not change application settings.</p></template><template id="models"><h1>AI Models</h1><p class="intro">Choose the local AI used to generate documents.</p><section class="group"><h2>Generation</h2><div class="row"><label for="provider">Provider</label><select id="provider"><option>LM Studio</option><option>Ollama</option><option>oMLX</option></select></div><div class="row"><div><label for="model">Generation model</label><p>Used unless a feature has its own model.</p></div><div class="choice"><select id="model"><option>Example local model</option></select><button aria-label="Refresh models">↻</button></div></div><div class="status">Connection not tested · synthetic preview</div></section><details><summary>Connection settings <span>LM Studio · localhost:1234</span></summary><div class="details-content"><div class="row"><label for="host">Host</label><input id="host" value="localhost"></div><div class="row"><label for="port">Port</label><input id="port" type="number" value="1234"></div><p>Authentication and other provider configurations remain available here.</p></div></details><details><summary>Model options <span>Feature models inherit · temperature 0.3</span></summary><div class="details-content"><div class="row"><label for="ocr">OCR / Vision model</label><select id="ocr"><option>Use generation model</option></select></div><div class="row"><label for="translation">Translation model</label><select id="translation"><option>Use generation model</option></select></div><div class="row"><label for="temperature">Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="0.3"></div></div></details></template><template id="prompts"><h1>Prompts &amp; Specialties</h1><p class="intro">Choose a specialty, then review its document instructions.</p><div class="row"><label for="specialty">Specialty</label><select id="specialty"><option>Family Medicine · built-in</option></select></div><div class="toolbar"><label for="doctype">Document type</label><select id="doctype"><option>SOAP note</option><option>Referral letter</option><option>Patient letter</option><option>Synopsis</option></select></div><p class="source">Using: built-in default · synthetic preview text below</p><label class="hidden" for="prompt">Prompt instructions</label><textarea id="prompt" aria-label="Prompt instructions" class="editor" spellcheck="false">SYNTHETIC DESIGN FIXTURE — NOT A CLINICAL PROMPT

The production editor displays the existing prompt verbatim.
This layout does not change clinical instructions or safety rules.

Document-type changes retain the unsaved-edit confirmation.
Save and Reset remain explicit actions.</textarea><div class="footer"><span id="draft-status">Preview only · not saved to the app</span><button>Reset</button><button class="primary">Save prompt</button></div><details><summary>Help <span>Prompt sources, specialty packs and tokens</span></summary><p>The production screen retains all existing token documentation and specialty safety guidance.</p></details></template><script>
const params=new URLSearchParams(location.search);document.documentElement.dataset.theme=params.get('theme')==='dark'?'dark':'light';function show(){const page=location.hash.slice(1)||'general';const t=document.getElementById(page);document.getElementById('content').innerHTML=t instanceof HTMLTemplateElement?t.innerHTML:'<h1>Not included in this preview</h1><p>This design preview covers General, AI Models and Prompts only.</p>';document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.page===page?'page':'false'));const appearance=document.getElementById('appearance');if(appearance){appearance.value=document.documentElement.dataset.theme==='dark'?'Dark':'Light';appearance.onchange=()=>{document.documentElement.dataset.theme=appearance.value.toLowerCase()}}const autosave=document.getElementById('autosave');if(autosave)autosave.onchange=()=>document.getElementById('interval').disabled=!autosave.checked;const prompt=document.getElementById('prompt');if(prompt)prompt.oninput=()=>document.getElementById('draft-status').textContent='Unsaved preview changes';}window.addEventListener('hashchange',show);document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';show()};show();</script></body></html>
