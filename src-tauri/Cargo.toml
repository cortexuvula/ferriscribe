[package]
name = "rust-medical-assistant"
version = "0.73.2"
description = "FerriScribe"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rust_medical_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
fs2 = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }

chrono = { workspace = true }
dirs = { workspace = true }
hound = { workspace = true }
futures-util = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

rusqlite = { workspace = true }
medical-backup = { path = "../crates/backup" }
medical-core = { path = "../crates/core" }
medical-db = { path = "../crates/db" }
medical-security = { path = "../crates/security" }
medical-audio = { path = "../crates/audio" }
medical-ai-providers = { path = "../crates/ai-providers" }
medical-stt-providers = { path = "../crates/stt-providers" }
medical-tts-providers = { path = "../crates/tts-providers" }
medical-agents = { path = "../crates/agents" }
medical-rag = { path = "../crates/rag" }
medical-processing = { path = "../crates/processing" }
medical-export = { path = "../crates/export" }
medical-translation = { path = "../crates/translation" }
medical-sharing = { path = "../crates/sharing" }
rand = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
axum = "0.8"
async-stream = "0.3"
urlencoding = { workspace = true }

# The `tts` crate's only Linux backend is speech-dispatcher, whose
# -dev headers (and runtime .so) aren't part of the app's dependency set —
# enabling `local-tts` there would break every Linux build and force a new
# system dependency on all Linux users for the Translate tab's read-aloud.
# macOS/Windows OS speech engines are always present, so the feature is
# enabled there only. Features union across applicable declarations.
[target.'cfg(not(target_os = "linux"))'.dependencies]
medical-tts-providers = { path = "../crates/tts-providers", features = ["local-tts"] }

[dev-dependencies]
tempfile = { workspace = true }
filetime = "0.2"
wiremock = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
# mock_app() for route tests (build_router needs an AppHandle)
tauri = { version = "2", features = ["test"] }
# ServiceExt::oneshot to drive the axum router without binding a port
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
