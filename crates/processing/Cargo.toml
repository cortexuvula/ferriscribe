[package]
name = "medical-processing"
version.workspace = true
edition.workspace = true

[dependencies]
medical-core = { path = "../core" }
medical-db = { path = "../db" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
pdf-extract = "0.12"
base64 = "0.23"
zip = "2.4"
quick-xml = "0.41"
calamine = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
pdfium-render = "0.9"
# pdfium runtime download (fetched into the app data dir on first scanned-PDF OCR,
# mirroring how whisper models are downloaded):
reqwest = { workspace = true }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
lopdf = "0.42"
futures-core = { workspace = true }

[lints]
workspace = true
