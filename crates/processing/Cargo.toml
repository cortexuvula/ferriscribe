[package]
name = "medical-processing"
version.workspace = true
edition.workspace = true

[dependencies]
medical-core = { path = "../core" }
medical-db = { path = "../db" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
pdf-extract = "0.7"
base64 = "0.22"
zip = "2.4"
quick-xml = "0.36"
calamine = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
libheif-rs = { version = "2.7", default-features = false, features = ["v1_17"] }
libheif-sys = { version = "5.3", features = ["embedded-libheif"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
lopdf = "0.34"
futures-core = { workspace = true }

[lints]
workspace = true
