[package]
name = "medical-stt-providers"
version.workspace = true
edition.workspace = true

[dependencies]
medical-core = { path = "../core" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
reqwest = { workspace = true }
tokio-stream = "0.1"
# Local STT
whisper-rs = "0.16"
# Exact-pinned: rc.13 resolved through the lock despite the rc.12 requirement
# (caret on a pre-release admits later pre-releases of the same 2.0.0 tuple);
# rc.12 is the release this crate was validated against.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "download-binaries", "std", "tls-native"] }
ndarray = "0.17"
knf-rs = "0.3.2"
rubato = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = { workspace = true }
tempfile = { workspace = true }
hound = { workspace = true }

[lints]
workspace = true
