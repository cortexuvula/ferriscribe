version: 2

# Dependabot monitors npm, cargo, and github-actions weekly. For a clinical /
# HIPAA-adjacent app a one-week lag on advisories is far better than waiting
# for a manual `npm audit` / `cargo audit` to surface them.
#
# Patch-and-minor bumps are grouped to reduce PR noise; major bumps still
# arrive as individual PRs since they often require code changes.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # tiptap v3 is a major breaking change requiring all editor extensions
      # to migrate together. Handle in a dedicated upgrade effort.
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      # tiptap-markdown 0.9.0+ requires @tiptap/core ^3.0.1 (incompatible
      # with our tiptap v2 stack). For 0.x packages, a minor bump is breaking
      # in semver terms. Ignore both minor and major until the tiptap v3
      # migration is done.
      - dependency-name: "tiptap-markdown"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps requiring dedicated migration effort (multi-crate, API changes)
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zip"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rubato"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rodio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aes-gcm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
