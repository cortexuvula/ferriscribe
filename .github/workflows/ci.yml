name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least-privilege defaults. Release artifacts are produced by release.yml,
# which grants its own write permissions; CI only needs to read + check out.
permissions:
  contents: read

jobs:
  # Fast, dependency-light gate: the three version files must agree before
  # anything else runs. A mismatch breaks the auto-updater (latest.json is
  # keyed by version), so this fails the build rather than silently shipping
  # a wrong-versioned installer. See scripts/check-version-sync.mjs.
  version-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Verify version is in sync across Cargo.toml / package.json / tauri.conf.json
        run: node scripts/check-version-sync.mjs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Lint (eslint)
        run: npm run lint
      - name: Frontend tests (vitest)
        run: npx vitest run
      - name: Coverage floors (vitest --coverage)
        # Thresholds live in vitest.config.ts — floors calibrated to the
        # 2026-08-25 baseline, ratcheted up as known gaps close. Fails the
        # build on coverage erosion, not on low absolute numbers.
        run: npm run test:coverage
      - name: Production bundle smoke-build
        # The only other place `vite build` runs is inside release.yml's
        # tauri build at tag-push — bundling-only failures (asset resolution,
        # import conditions that differ between vitest and rollup) would
        # otherwise surface after tagging.
        run: npm run build

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libssl-dev pkg-config libspeechd-dev
      - name: Stage backup sidecar (debug)
        # tauri-build validates externalBin existence at COMPILE time;
        # stage a debug build (reuses this job's dev artifacts).
        run: node scripts/build-sidecar.mjs --debug
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        # lib + tests only — the Tauri shell pulls in platform GUI deps that
        # aren't relevant to the workspace lint gate. `--all-targets` includes
        # tests/examples so we catch lint regressions in test code too.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy local-tts feature (-D warnings)
        # The `local-tts` feature is off by default and pulled in by nothing,
        # so the workspace-wide clippy pass never compiles it — it rotted
        # unnoticed before this gate existed. On Linux the tts crate pulls in
        # speech-dispatcher-sys, whose build script pkg-configs libspeechd —
        # hence the libspeechd-dev apt above.
        run: cargo clippy -p medical-tts-providers --all-targets --features local-tts -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Hosted Windows runners crash medical-audio's cpal device-enumeration
        # tests (STATUS_ACCESS_VIOLATION) because they have no audio hardware.
        # macOS runners are excluded too: macos-latest (Xcode 26.5) has a
        # persistent clang_rt.osx linker path bug, and macos-14 has a
        # whisper.cpp/ggml_abort compile mismatch. Both are runner-image
        # issues, not code issues — macOS builds are validated locally.
        # release.yml builds installers on all platforms (no tests).
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libssl-dev pkg-config

      - name: Stage backup sidecar (debug)
        # tauri-build validates externalBin existence at COMPILE time;
        # stage a debug build (reuses this job's dev artifacts).
        run: node scripts/build-sidecar.mjs --debug
      - name: Workspace lib tests
        run: cargo test --workspace --lib

      - name: Sharing integration tests
        env:
          # Hosted macOS runners' multicast support is unreliable.
          # Only Linux runners exercise the mDNS smoke test.
          FERRISCRIBE_MDNS_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test -p medical-sharing

      - name: DB integration tests
        # medical-db's tests/ suite (condition_chips_sync, content_sync,
        # encryption, recording_sync_merge) is not covered by --lib. Run it
        # explicitly so a stale integration test can't slip onto master the
        # way condition_chips_sync did after the increment_use signature change.
        run: cargo test -p medical-db

  # Security advisory scan — catches RustSec advisories on the dependency
  # tree. For a HIPAA-adjacent app this is important: known CVEs in crypto,
  # network, or archive crates must not ship silently.
  coverage:
    # Line coverage of the workspace lib tests. Fails below a floor set just
    # under the measured baseline (see --fail-under-lines) so erosion is
    # caught, not absolute numbers judged. Needs the same Linux deps + sidecar
    # staging as the test job (src-tauri must compile).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libssl-dev pkg-config
      - uses: taiki-e/install-action@17dfa9a7aa66ae804b5cbd9f505a33815221f967 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Stage backup sidecar (debug)
        # tauri-build validates externalBin existence at COMPILE time.
        run: node scripts/build-sidecar.mjs --debug
      - name: Workspace lib coverage
        run: cargo llvm-cov --workspace --lib --summary-only --fail-under-lines 70

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: taiki-e/install-action@17dfa9a7aa66ae804b5cbd9f505a33815221f967 # cargo-audit
        # `tool` defaults to cargo-audit when omitted — set explicitly so
        # this job and the new coverage job can't silently cross-install.
        with:
          tool: cargo-audit
      - name: Cargo audit
        # cargo-audit exits non-zero on vulnerabilities (security holes) by
        # default, and exits zero on "unmaintained" warnings. We don't use
        # --deny warnings because unmaintained crates (GTK3 bindings from
        # Tauri's Linux webview, proc-macro-error, etc.) are transitive deps
        # we can't control. Ignored advisories are parse-only vectors in
        # transitive deps:
        # - lopdf (RUSTSEC-2026-0187): PDF parse stack overflow via deeply
        #   nested objects. Transitive from printpdf (write-only, no risk)
        #   and pdf-extract (OCR text extraction from USER-SUPPLIED PDFs —
        #   a crafted PDF COULD trigger this). Risk accepted: pdf-extract
        #   runs locally, crash is non-exploitable (DoS only, no RCE), and
        #   the user explicitly dropped the file for OCR. TODO: migrate to
        #   a sandboxed PDF parser or lopdf >=0.42 by 2026-10-01.
        # - quick-xml (RUSTSEC-2026-0194, 0195): XML parse DoS. Our direct
        #   DOCX parsing (user-supplied files!) was on 0.36 — now bumped to
        #   0.41, deduped with the docx-rs/plist copies. The remaining 0.31
        #   copy comes via calamine, which parses user-supplied XLSX in OCR —
        #   external input, but same accepted-risk profile: local, DoS-only,
        #   no RCE, user explicitly dropped the file.
        # Tracked for dependency bumps (printpdf 0.7→0.9, pdf-extract→alt).
        # Expiry comments force a periodic revisit so ignores don't linger
        # after the upstream fix lands.
        # TODO(review-by 2026-10-01): lopdf — revisit when printpdf 0.9 migration is done
        # TODO(review-by 2026-10-01): quick-xml — revisit when calamine moves past 0.31
        run: cargo audit --ignore RUSTSEC-2026-0187 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
