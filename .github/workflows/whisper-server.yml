name: Build whisper-server

on:
  push:
    tags:
      - 'whisper-server-v*'
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: 'whisper.cpp upstream tag to build'
        required: true
        default: 'v1.8.4'
      release_tag:
        description: 'whisper-server-vX.Y.Z tag to publish assets under (upload is skipped when empty)'
        required: false
        default: ''

env:
  WHISPER_TAG: ${{ github.event.inputs.whisper_tag || 'v1.8.4' }}
  # Publish target. On tag pushes this is the pushed tag. On manual
  # dispatch github.ref_name is the BRANCH (e.g. master) — publishing
  # under it would create a bogus release — so dispatch must name the
  # release tag explicitly; empty means the upload step is skipped.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  # Opt into Node.js 24 for GitHub Actions (actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7 and others
  # still run on Node.js 20 by default, which is deprecated as of 2026-05-26).
  # Node.js 24 will become the default on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            triple: darwin-aarch64
            archive: tar.gz
          - platform: ubuntu-24.04
            triple: linux-x86_64
            archive: tar.gz
          - platform: windows-latest
            triple: windows-x86_64
            archive: zip

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Validate inputs
        run: |
          # whisper_tag MUST be an upstream RELEASE tag (v-prefixed semver):
          # CMake configure/build executes the checked-out code, and this
          # job's token carries contents:write — an arbitrary ref would be
          # untrusted code running with release-publishing privileges.
          echo "$WHISPER_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "::error::whisper_tag must be an upstream release tag like v1.8.4, got: $WHISPER_TAG"; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then
            echo "$RELEASE_TAG" | grep -Eq '^whisper-server-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
              || { echo "::error::release_tag must look like whisper-server-v1.2.3, got: $RELEASE_TAG"; exit 1; }
          fi

      - name: Checkout whisper.cpp
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_TAG }}
          path: whisper.cpp

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure (CMake)
        working-directory: whisper.cpp
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DWHISPER_BUILD_SERVER=ON
          -DBUILD_SHARED_LIBS=OFF

      - name: Build server
        working-directory: whisper.cpp
        run: cmake --build build --config Release --target whisper-server

      - name: Verify no whisper/ggml dynamic deps (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          BIN=whisper.cpp/build/bin/whisper-server
          echo "otool -L $BIN:"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -E '(libwhisper|libggml)'; then
            echo "::error::whisper-server still links libwhisper/libggml dynamically — static build did not take effect"
            exit 1
          fi

      - name: Verify no whisper/ggml dynamic deps (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          BIN=whisper.cpp/build/bin/whisper-server
          echo "ldd $BIN:"
          ldd "$BIN" || true
          if ldd "$BIN" | grep -E '(libwhisper|libggml)'; then
            echo "::error::whisper-server still links libwhisper/libggml dynamically — static build did not take effect"
            exit 1
          fi

      - name: Verify no whisper/ggml shared libs were built (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildBin = "whisper.cpp/build/bin/Release"
          $dlls = Get-ChildItem $buildBin -Filter '*.dll' -ErrorAction SilentlyContinue
          if ($dlls) {
            Write-Output "DLLs in build output:"
            $dlls | ForEach-Object { Write-Output ("  " + $_.Name) }
          } else {
            Write-Output "No DLLs in build output (good — static link)"
          }
          $bad = $dlls | Where-Object { $_.Name -match '(?i)(whisper|ggml)' }
          if ($bad) {
            $names = ($bad | ForEach-Object Name) -join ', '
            Write-Error "whisper.cpp produced shared libs: $names — BUILD_SHARED_LIBS=OFF did not take effect"
            exit 1
          }

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp whisper.cpp/build/bin/whisper-server stage/
          chmod +x stage/whisper-server

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp whisper.cpp/build/bin/Release/whisper-server.exe stage/

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path whisper-server.exe -DestinationPath ../whisper-server-${{ matrix.triple }}.zip"
          else
            zip ../whisper-server-${{ matrix.triple }}.zip whisper-server
          fi

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar czf whisper-server-${{ matrix.triple }}.tar.gz -C stage whisper-server

      - name: Compute SHA-256
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then SHA=$(shasum -a 256 whisper-server-${{ matrix.triple }}.${{ matrix.archive }} | awk '{print $1}');
          elif [ "${{ runner.os }}" = "Windows" ]; then SHA=$(powershell -Command "(Get-FileHash whisper-server-${{ matrix.triple }}.${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower()");
          else SHA=$(sha256sum whisper-server-${{ matrix.triple }}.${{ matrix.archive }} | awk '{print $1}'); fi
          echo "SHA256=$SHA" | tee -a "$GITHUB_ENV"
          echo "::notice title=whisper-server ${{ matrix.triple }}::SHA256=$SHA"

      - name: Upload to release
        # Skipped on manual dispatch without an explicit release_tag —
        # github.ref_name would be the branch, not a whisper-server tag.
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: whisper-server-${{ matrix.triple }}.${{ matrix.archive }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false

      - name: Notice (upload skipped)
        if: env.RELEASE_TAG == ''
        run: |
          echo "::notice::No release_tag provided (manual dispatch) — built artifacts were NOT uploaded to a release. SHA-256 digests are in the step log above."
