name: Scheduled cargo audit

# Re-scans Cargo.lock for RustSec advisories between releases. ci.yml's
# security job only runs on PR/push, so an advisory published after the last
# push would otherwise go unnoticed until the next code change touches the
# repo. Scheduled workflows run against the default branch's copy of this
# file.
#
# Keep the --ignore list and the accepted-risk rationale in sync with the
# security job in ci.yml (the canonical, commented copy lives there).

on:
  schedule:
    # Mondays, 06:30 UTC.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: taiki-e/install-action@17dfa9a7aa66ae804b5cbd9f505a33815221f967 # cargo-audit
        with:
          tool: cargo-audit
      - name: Cargo audit
        # Ignore list + accepted-risk rationale mirror the security job in
        # ci.yml (the canonical, fully commented copy lives there). The zip
        # ignores cover the docx-rs-0.4.22-pinned zip 8.6.0 copy only
        # (extract*()/extract unreachable via docx-rs; writer-only usage
        # here) — see docs/security/RUSTSEC-2026-0429-exception.md.
        # scripts/audit-0429-guard.mjs fail-closes the advisory-ID-wide
        # RUSTSEC-2026-0429 ignore to exactly that residual and fails after
        # its 2026-12-02 review date. Do not add ignores here that ci.yml
        # does not carry.
        run: node scripts/audit-0429-guard.mjs && cargo audit --ignore RUSTSEC-2026-0187 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0429
