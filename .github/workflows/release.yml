name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Opt into Node.js 24 for GitHub Actions (actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 and others
  # still run on Node.js 20 by default, which is deprecated as of 2026-05-26).
  # Node.js 24 will become the default on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Create the DRAFT release up front so every platform job uploads to the
  # SAME release by ID. tauri-action's release lookup cannot reliably see
  # drafts (GitHub's by-tag endpoint excludes them), so letting each job
  # create/find the draft raced: the v0.74.2 run split assets across a
  # public Linux-only release and a private macOS+Windows draft, and the
  # manifest job (correctly) refused to publish a partial updater manifest.
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release (never reuse a published one)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reruns (or a leftover from a failed attempt) may reuse an
          # existing DRAFT release for this tag — but a PUBLISHED release
          # is immutable: reusing it would let a later build failure's
          # cleanup delete a live public release (U3). If a published
          # release for this tag exists, fail loudly instead.
          EXISTING=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" | head -1)
          if [ -n "$EXISTING" ]; then
            ID=$(echo "$EXISTING" | cut -f1)
            IS_DRAFT=$(echo "$EXISTING" | cut -f2)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::A PUBLISHED release for $TAG already exists (id $ID). Published releases are immutable — delete it manually first if a rebuild is truly intended."
              exit 1
            fi
            echo "release_id=$ID" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing DRAFT release for $TAG (id $ID)"
            exit 0
          fi
          if [[ "$TAG" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          RESPONSE=$(gh api "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" \
            -f name="FerriScribe $TAG" \
            -f body="See the assets below to download and install this version." \
            -F draft=true \
            -F prerelease=$PRERELEASE)
          ID=$(echo "$RESPONSE" | jq '.id')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Draft release created for $TAG (id $ID)"

  # U6: the tag must match the version embedded in the three synced
  # version files — a mismatched tag makes the manifest advertise a
  # version the installed binary doesn't report, so clients re-offer the
  # "update" forever (and a beta-configured commit could ship as stable).
  version-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full, for the tag's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Tag must equal the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::Unexpected tag shape: ${GITHUB_REF_NAME}"
            exit 1
          fi
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG cargo=$CARGO package.json=$PKG tauri.conf.json=$CONF"
          for V in "$CARGO" "$PKG" "$CONF"; do
            if [ "$V" != "$TAG" ]; then
              echo "::error::Version mismatch: tag $TAG != embedded version $V. Bump all three version files (src-tauri/Cargo.toml, package.json, src-tauri/tauri.conf.json) to match the tag before re-tagging."
              exit 1
            fi
          done
          echo "Tag/version agreement verified."


  release:
    needs: [prepare, version-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS dropped: GitHub-hosted macos-13 Intel runners are
          # effectively unavailable (jobs queue indefinitely, get cancelled
          # at 24h). Apple Silicon DMG only. Re-add a universal-apple-darwin
          # target on macos-latest if Intel support becomes necessary again.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Linux: install system deps required by Tauri and cpal (ALSA).
      # xvfb: the boot smoke test launches the app headless.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            clang \
            cmake \
            libfuse2t64 \
            xvfb
          # libfuse2t64 (= libfuse2 on 24.04's t64 naming): linuxdeploy needs
          # FUSE on the build host to assemble the AppImage.

      - name: Build ferriscribe-backup sidecar
        # The backup sidecar is bundled via externalBin and must be staged
        # with the target-triple suffix BEFORE tauri-action builds (it
        # builds with --target). beforeBuildCommand can't know the
        # cross-target, so this step is explicit.
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}
        env:
          # Match the main build's deployment target (sqlcipher builds).
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — produces .sig files + latest.json manifest
          # so the in-app auto-updater can verify + install updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: whisper.cpp requires std::filesystem (macOS 11.0+)
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          # whisper-rs-sys forwards CMAKE_* env vars as cmake defines
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          # macOS code signing — only meaningful on macOS runners
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # Upload to the SHARED draft release created by the `prepare` job.
          # Uploading by ID skips tauri-action's by-tag release lookup —
          # which cannot see drafts and previously raced the three platform
          # jobs into split releases. tagName/releaseName/releaseBody below
          # are fallbacks for a world where releaseId is empty.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: 'FerriScribe ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          # The release is a DRAFT (created by `prepare`): it goes public
          # only when the `publish` job runs — after EVERY platform job has
          # built, uploaded, and passed its boot smoke test. A build that
          # crashes at launch (the v0.74.1 class) must never reach users;
          # if anything fails, the cleanup job deletes the draft.
          releaseDraft: true
          # Tags with a semver pre-release suffix (e.g. v0.10.85-beta.1) ship
          # as GitHub prereleases; plain vX.Y.Z tags ship as stable. Promote
          # a beta to stable by tagging the same commit vX.Y.Z.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

      # ── Boot smoke test ──────────────────────────────────────────────────
      #
      # Launch the freshly built release binary and assert it survives
      # AppState::initialize without panicking — the v0.74.1 release crashed
      # ~1.4 s after launch on every platform (a tokio::spawn outside any
      # runtime, aborted hard by panic = "abort") because nothing between
      # the test suites and the published release ever BOOTED the app. This
      # step is that boot. Runs against the real release-profile binary, so
      # profile-dependent behavior (panic = abort, LTO) is exercised.
      - name: Boot smoke test
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/rust-medical-assistant"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          RUNNER=""
          # Linux runners are headless — the webview needs a display server.
          if [ "$RUNNER_OS" = "Linux" ]; then RUNNER="xvfb-run -a"; fi

          set +e
          $RUNNER "$BIN" > boot_smoke.log 2>&1 &
          APP_PID=$!
          # Long enough for a cold first-run init (keychain, DB creation).
          sleep 30
          kill "$APP_PID" 2>/dev/null || true
          # Git Bash can't always signal native exes — force-kill by image name.
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //IM rust-medical-assistant.exe >/dev/null 2>&1 || true
          fi
          sleep 2
          wait "$APP_PID" 2>/dev/null
          EXIT_STATUS=$?
          set -e

          echo "──── boot log (tail) ────"
          tail -40 boot_smoke.log || true

          # U5: positive readiness gate. The startup banner logs BEFORE
          # initialization, so it only proves the binary launched — a boot
          # that died in a recovery/fatal dialog also printed it. Require
          # the post-init success line AND fail on the init-failure
          # markers, so the v0.74.1 class (crash after banner) and the
          # dialog-stuck class both fail this gate.
          if ! grep -q "FerriScribe starting" boot_smoke.log; then
            echo "::error::Boot smoke FAILED — the app never logged its startup banner"
            exit 1
          fi
          if ! grep -q "FerriScribe initialization complete" boot_smoke.log; then
            echo "::error::Boot smoke FAILED — no positive post-initialization readiness signal (init failed, crashed mid-init, or never completed). See log above."
            exit 1
          fi
          if grep -E -q "PANIC|panicked at|Database recovery needed|Fatal application initialization error" boot_smoke.log; then
            echo "::error::Boot smoke FAILED — the app panicked or booted into a recovery/fatal state (see log above)"
            exit 1
          fi
          # A hard crash mid-boot (SIGSEGV/SIGABRT under panic=abort) can
          # beat every grep above when the log file never got the lines —
          # the readiness grep already catches that. This check catches
          # the inverse: init completed but the process died right after
          # (native teardown crash) — nonzero exit after kill -TERM is
          # expected, so only treat 129-165 signal-range exits as failure
          # when the readiness line is ABSENT (handled above). Keep the
          # explicit panic-class check regardless:
          if grep -E -q "SIGABRT|SIGSEGV|Segmentation fault|Aborted" boot_smoke.log; then
            echo "::error::Boot smoke FAILED — native crash signature in boot log"
            exit 1
          fi
          echo "Boot smoke passed: startup banner, positive init-complete signal, no panic/recovery markers."

  # Runs once, after EVERY platform job has built, uploaded, and passed its
  # boot smoke. Verifies the draft holds all three platforms' assets AND a
  # complete, validated consolidated latest.json (U4: publish LAST — the
  # release goes public only when the updater manifest clients will fetch
  # is fully built and verified), then makes the release public.
  manifest:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      # Generate the consolidated latest.json from the DRAFT's assets and
      # upload it back to the draft. The release is still private here, so
      # clients cannot observe a partial manifest state (U4).
      - name: Generate consolidated latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'SCRIPT'
          const { execFileSync } = require('child_process');
          const fs = require('fs');

          // The tag comes from the push ref and asset names come from the
          // release — both are externally influenceable. Validate the tag
          // shape up front (every gh arg, URL, and filename below is then
          // known-boring), and never interpolate either into a shell
          // string: execFileSync passes arguments without interpretation.
          const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
          if (!/^v\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$/.test(tag)) {
            console.error(`Refusing to build latest.json: unexpected tag shape: ${tag}`);
            process.exit(1);
          }
          const version = tag.replace(/^v/, '');
          const repo = process.env.GITHUB_REPOSITORY;
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' });
          const pubDate = JSON.parse(gh('release', 'view', tag, '--json', 'createdAt')).createdAt;
          const notes = JSON.parse(gh('release', 'view', tag, '--json', 'body')).body;

          const assetNames = JSON.parse(gh('release', 'view', tag, '--json', 'assets')).assets.map(
            (a) => a.name
          );

          const platforms = {};
          // Prefer the AppImage for the linux updater target: Tauri's
          // auto-updater on Linux only installs AppImages, so deb/rpm URLs
          // (kept for pre-AppImage releases / manual installs) lose when
          // both exist.
          const hasAppImage = assetNames.some((n) => n.endsWith('.AppImage'));

          for (const name of assetNames) {
            if (!name.endsWith('.sig')) continue;
            const baseAsset = name.replace(/\.sig$/, '');
            if (!assetNames.includes(baseAsset)) continue;

            // Read the signature content
            const signature = gh('release', 'download', tag, '--pattern', name, '--output', '-').trim();

            // Map filename to Tauri platform key. NOTE: `name` is the .sig
            // file — match platform shapes against the BASE asset.
            let platform = null;
            if (baseAsset.endsWith('.AppImage')) platform = 'linux-x86_64';
            else if ((name.includes('.deb') || name.includes('.rpm')) && !hasAppImage)
              platform = 'linux-x86_64';
            else if (name.includes('.msi') || name.includes('-setup.exe')) platform = 'windows-x86_64';
            else if (name.includes('aarch64.app')) platform = 'darwin-aarch64';
            else if (name.includes('x86_64.app')) platform = 'darwin-x86_64';
            else continue;

            // Only keep the NSIS updater format for Windows (not MSI)
            if (name.includes('.msi') && assetNames.some(n => n.includes('-setup.exe'))) continue;

            platforms[platform] = {
              signature,
              url: `${baseUrl}/${baseAsset}`,
            };
          }

          // Completeness guard: this upload overwrites the release's
          // latest.json with --clobber. If platform detection silently
          // matched nothing (renamed asset, missing build), refuse rather
          // than strand every auto-updater client on a partial manifest
          // until the next release.
          const expected = ['linux-x86_64', 'windows-x86_64', 'darwin-aarch64'];
          const missing = expected.filter((p) => !platforms[p]);
          if (missing.length > 0) {
            console.error(`Refusing to overwrite latest.json: missing platforms: ${missing.join(', ')}`);
            console.error(`Assets seen: ${assetNames.join(', ')}`);
            process.exit(1);
          }

          const manifest = {
            version,
            notes,
            pub_date: pubDate,
            platforms,
          };

          console.log('Generated manifest:', JSON.stringify(manifest, null, 2));
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          SCRIPT

      - name: Upload consolidated latest.json (to the DRAFT)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Same shape gate as the generator: "$TAG" inside double quotes
          # still expands $(...) — never hand an unvalidated tag to a shell.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to upload latest.json: unexpected tag shape: $TAG"
            exit 1
          fi
          gh release upload "$TAG" latest.json --clobber
          echo "Consolidated latest.json uploaded to draft release $TAG"

  publish:
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify all platform assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "──── assets on the draft ────"
          echo "$ASSETS"
          MISSING=0
          echo "$ASSETS" | grep -q "aarch64.app" || { echo "::error::missing macOS (aarch64) assets"; MISSING=1; }
          echo "$ASSETS" | grep -qE -- "-setup\.exe|\.msi$" || { echo "::error::missing Windows assets"; MISSING=1; }
          echo "$ASSETS" | grep -q "\.AppImage" || { echo "::error::missing Linux (AppImage) asset"; MISSING=1; }
          # U4: the consolidated manifest must already be on the draft —
          # publishing without it strands auto-updater clients.
          echo "$ASSETS" | grep -q "^latest\.json$" || { echo "::error::missing consolidated latest.json (manifest job)"; MISSING=1; }
          if [ "$MISSING" != "0" ]; then exit 1; fi
          gh release edit "$TAG" --draft=false
          echo "Release published."

  # Anything failed after the draft was created — remove it so no broken or
  # partial artifacts linger hidden on the tag. The tag itself stays.
  # U3: deletes ONLY the exact draft this run created/reused (by ID, after
  # re-verifying it is still a draft) — never by tag, which could match a
  # published release.
  cleanup:
    needs: [release, publish]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete draft release on failure (by ID, drafts only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "No release id from prepare — nothing to clean up."
            exit 0
          fi
          IS_DRAFT=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft' 2>/dev/null || echo "gone")
          if [ "$IS_DRAFT" = "gone" ]; then
            echo "Release $RELEASE_ID already deleted — nothing to do."
            exit 0
          fi
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Refusing to delete release $RELEASE_ID: it is PUBLISHED, not a draft. A failure after publication must not remove a live release."
            exit 1
          fi
          gh api -X DELETE "repos/$GH_REPO/releases/$RELEASE_ID"
          echo "Draft release $RELEASE_ID deleted."

  # Prune old releases after a successful build, keeping only the 5 newest
  # (by semver). Deletes both the release assets and the git tag. Only
  # matches FerriScribe version tags (vX.Y.Z); leaves whisper-server-* and
  # other non-version tags untouched. Runs once after all platform builds.
  prune:
    needs: [publish, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prune to 5 newest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-old-releases.mjs
