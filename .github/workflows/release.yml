name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Opt into Node.js 24 for GitHub Actions (actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 and others
  # still run on Node.js 20 by default, which is deprecated as of 2026-05-26).
  # Node.js 24 will become the default on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS dropped: GitHub-hosted macos-13 Intel runners are
          # effectively unavailable (jobs queue indefinitely, get cancelled
          # at 24h). Apple Silicon DMG only. Re-add a universal-apple-darwin
          # target on macos-latest if Intel support becomes necessary again.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Linux: install system deps required by Tauri and cpal (ALSA)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            clang \
            cmake

      - name: Build ferriscribe-backup sidecar
        # The backup sidecar is bundled via externalBin and must be staged
        # with the target-triple suffix BEFORE tauri-action builds (it
        # builds with --target). beforeBuildCommand can't know the
        # cross-target, so this step is explicit.
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}
        env:
          # Match the main build's deployment target (sqlcipher builds).
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — produces .sig files + latest.json manifest
          # so the in-app auto-updater can verify + install updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: whisper.cpp requires std::filesystem (macOS 11.0+)
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          # whisper-rs-sys forwards CMAKE_* env vars as cmake defines
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          # macOS code signing — only meaningful on macOS runners
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FerriScribe ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          # Tags with a semver pre-release suffix (e.g. v0.10.85-beta.1) ship
          # as GitHub prereleases; plain vX.Y.Z tags ship as stable. Promote
          # a beta to stable by tagging the same commit vX.Y.Z.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

  # Prune old releases after a successful build, keeping only the 5 newest
  # (by semver). Deletes both the release assets and the git tag. Only
  # matches FerriScribe version tags (vX.Y.Z); leaves whisper-server-* and
  # other non-version tags untouched. Runs once after all platform builds.
  prune:
    needs: [release, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prune to 5 newest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-old-releases.mjs

  # Generate a consolidated latest.json AFTER all platform builds complete.
  # Each platform job auto-generates its own partial latest.json via
  # tauri-action; this job overwrites it with a manifest that includes ALL
  # platforms, eliminating the updater race condition where clients see a
  # new version before their platform binary is uploaded.
  manifest:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Generate consolidated latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Generating consolidated latest.json for $TAG"

          # Get release metadata
          PUB_DATE=$(gh release view "$TAG" --json createdAt -q .createdAt)
          NOTES=$(gh release view "$TAG" --json body -q .body)

          # List all assets
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')

          # Generate latest.json using Node
          node << 'SCRIPT'
          const { execSync } = require('child_process');
          const fs = require('fs');

          const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
          const version = tag.replace(/^v/, '');
          const repo = process.env.GITHUB_REPOSITORY;
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const pubDate = execSync(`gh release view ${tag} --json createdAt -q .createdAt`).toString().trim();
          const notes = execSync(`gh release view ${tag} --json body -q .body`).toString().trim();

          const assetsJson = JSON.parse(execSync(`gh release view ${tag} --json assets`).toString());
          const assetNames = assetsJson.assets.map(a => a.name);

          const platforms = {};

          for (const name of assetNames) {
            if (!name.endsWith('.sig')) continue;
            const baseAsset = name.replace(/\.sig$/, '');
            if (!assetNames.includes(baseAsset)) continue;

            // Read the signature content
            const signature = execSync(`gh release download ${tag} --pattern "${name}" --output - 2>/dev/null`).toString().trim();

            // Map filename to Tauri platform key
            let platform = null;
            if (name.includes('.deb') || name.includes('.rpm')) platform = 'linux-x86_64';
            else if (name.includes('.msi') || name.includes('-setup.exe')) platform = 'windows-x86_64';
            else if (name.includes('aarch64.app')) platform = 'darwin-aarch64';
            else if (name.includes('x86_64.app')) platform = 'darwin-x86_64';
            else continue;

            // Only keep the NSIS updater format for Windows (not MSI)
            if (name.includes('.msi') && assetNames.some(n => n.includes('-setup.exe'))) continue;

            platforms[platform] = {
              signature,
              url: `${baseUrl}/${baseAsset}`,
            };
          }

          const manifest = {
            version,
            notes,
            pub_date: pubDate,
            platforms,
          };

          console.log('Generated manifest:', JSON.stringify(manifest, null, 2));
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          SCRIPT

      - name: Upload consolidated latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" latest.json --clobber
          echo "Consolidated latest.json uploaded to release $TAG"
