[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/security",
    "crates/audio",
    "crates/ai-providers",
    "crates/sharing",
    "crates/stt-providers",
    "crates/tts-providers",
    "crates/agents",
    "crates/rag",
    "crates/processing",
    "crates/export",
    "crates/translation",
    "crates/backup",
    "src-tauri",
]

[workspace.package]
# This is the version of the 13 medical-* library crates (all pre-1.0). The
# application version (currently 0.20.x) is tracked separately in
# src-tauri/Cargo.toml, package.json, and src-tauri/tauri.conf.json — those
# three MUST stay in sync (enforced by scripts/check-version-sync.mjs in CI),
# but they intentionally do NOT inherit from here, because the library crates
# version independently of the app release cadence.
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Workspace-wide Clippy lint configuration. This is Cargo's official mechanism
# for setting lint levels across every member crate without sprinkling
# `#![allow(...)]` attributes at each crate root. Enforced in CI via
# `cargo clippy --workspace --all-targets -- -D warnings`.
#
# `field_reassign_with_default` — the pattern `let mut cfg = Config::default();
# cfg.field = x;` is deliberate style here; the suggested struct-init form is
# not uniformly more readable when many fields are set across statements.
[workspace.lints.clippy]
field_reassign_with_default = "allow"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tracing-appender = "0.2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
eventsource-stream = "0.2"
tokio-stream = "0.1"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }

# Crates pinned at workspace level to keep one source of truth.
# `dirs` was previously split (5 in sharing, 6 in src-tauri); unifying to 6
# is the only real version dedup — the rest already match across crates.
# `keyring` was previously declared identically in src-tauri, security and
# sharing; hoisted here so the platform backends cannot drift between them.
rand = "0.9"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
hound = "3.5"
urlencoding = "2"
dirs = "6"
tempfile = "3"
wiremock = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
