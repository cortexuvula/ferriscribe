[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/security",
    "crates/audio",
    "crates/ai-providers",
    "crates/sharing",
    "crates/stt-providers",
    "crates/tts-providers",
    "crates/agents",
    "crates/rag",
    "crates/processing",
    "crates/export",
    "crates/translation",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
eventsource-stream = "0.2"
tokio-stream = "0.1"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }

# Crates pinned at workspace level to keep one source of truth.
# `dirs` was previously split (5 in sharing, 6 in src-tauri); unifying to 6
# is the only real version dedup — the rest already match across crates.
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
hound = "3.5"
urlencoding = "2"
dirs = "6"
tempfile = "3"
proptest = "1"
wiremock = "0.6"
